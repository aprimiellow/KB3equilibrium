-radius:13px;color:#615b4e;font-size:14px;line-height:1.8}\n.section{position:relative;margin:0 0 23px;padding:23px;background:#fff;border-radius:22px;box-shadow:0 6px 18px rgba(60,50,25,.06)}\n.section:before{content:\"\";position:absolute;top:0;left:23px;width:65px;height:5px;background:var(--yellow);border-radius:0 0 6px 6px}\n.section-head{display:flex;align-items:flex-start;gap:12px;margin:5px 0 16px}\n.index{display:flex;align-items:center;justify-content:center;flex:0 0 38px;height:38px;border-radius:13px;background:var(--yellow);font-size:13px;font-weight:800}\n.section:nth-of-type(odd) .index{background:var(--orange);color:white}\n.section-head h2{margin:0 0 3px;font-size:20px;line-height:1.45;font-weight:700}\n.section-head p{margin:0;color:#858074;font-size:13px;line-height:1.6}\n.eq{margin:16px 0;padding:17px 12px;background:#fffaf0;border:1px solid #f0e6c7;border-radius:14px;text-align:center;font-size:clamp(21px,3.3vw,27px);font-weight:700;line-height:1.5;overflow-wrap:anywhere}\n.data-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}\n.datum{padding:12px 13px;background:#faf9f4;border-radius:12px;min-width:0}\n.datum strong{display:block;margin-bottom:3px;color:#817b6d;font-size:11px;letter-spacing:.5px;text-transform:uppercase}\n.datum span{font-size:15px;font-weight:650;overflow-wrap:anywhere}\n.prompt{margin:15px 0 10px;font-weight:600}\ntable{width:100%;border-collapse:collapse;margin:13px 0 16px;font-size:14px}\nth,td{border:1px solid #e8e3d4;padding:11px 10px;text-align:center;vertical-align:middle}\nth{background:#fff1a8;font-weight:700}\ntd:first-child{text-align:left}\ninput[type=number],input[type=text]{width:100%;max-width:190px;padding:10px 11px;border:1.5px solid #d8d2c2;border-radius:9px;background:white;color:var(--ink);font:inherit;text-align:center}\n.sci-entry{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;white-space:nowrap}\n.sci-entry .sci-coeff{width:100px;max-width:42%;padding:9px 5px}\n.sci-entry .times-ten{font-size:17px;font-weight:650;white-space:nowrap}\n.sci-entry .sci-exp{width:53px;max-width:25%;padding:5px 3px;font-size:13px;position:relative;top:-12px;margin-left:-5px;flex:0 0 auto}\n.sci-entry .power-part{display:inline-flex;align-items:flex-start;gap:0;line-height:1}\n.sci-help{font-size:12px;color:#777164;margin-top:5px}\n@media(max-width:700px){.sci-entry{gap:4px}.sci-entry .sci-coeff{width:82px;padding:8px 3px;font-size:13px}.sci-entry .times-ten{font-size:14px}.sci-entry .sci-exp{width:43px;font-size:12px;padding:5px 2px;top:-9px;margin-left:-4px}}\ninput:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #d87536;outline-offset:3px}\nbutton,.nav{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:14px;background:var(--orange);color:#fff;padding:12px 19px;font-family:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;transition:background .18s,transform .18s}\nbutton:hover,.nav:hover{background:#e87f3b;transform:translateY(-1px)}\n.button-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.secondary{background:#fff7e2;color:#554b36;border:1px solid #efe2b9;box-shadow:none}\n.secondary:hover{background:#ffefc2}\n.feedback{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.75}\n.feedback.show{display:block}.feedback.good{background:var(--green);border-left:4px solid #83ad75}.feedback.note{background:#fff8df;border-left:4px solid var(--yellow)}.feedback.try{background:var(--red);border-left:4px solid var(--orange)}\ndetails.hint{margin:13px 0;border-top:1px solid #eee8d9;padding-top:12px}\ndetails.hint summary{cursor:pointer;color:#b9632d;font-size:14px;font-weight:700}\n.hint-body{margin-top:10px;padding:12px 14px;background:#fffbea;border-radius:10px;color:#615b4e;font-size:14px}\n.section-foot{margin-top:14px;color:#858074;font-size:12px}\n.completion{display:flex;align-items:flex-start;gap:12px;margin:22px 0;padding:20px 22px;background:#333;color:#fff;border-radius:20px}\n.completion-mark{display:flex;align-items:center;justify-content:center;flex:0 0 35px;height:35px;background:var(--yellow);color:#333;border-radius:11px;font-weight:800}\n.completion h2{margin:0 0 5px;color:#fff;font-size:19px}\n.completion p{margin:0;color:#f1eee5;font-size:14px}\n.navrow{display:flex;justify-content:space-between;gap:12px;margin:24px 2px 8px}\n.nav{border-radius:20px;box-shadow:0 4px 0 #d96d2d}\n.nav-placeholder{visibility:hidden}\n@media(max-width:700px){body{padding:10px}.opening{padding:9px 3px 20px}.opening h1{font-size:29px}.opening p{font-size:15px}.section{padding:19px 14px;border-radius:17px}.section:before{left:14px}.section-head h2{font-size:18px}.data-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.progress-panel{gap:9px;padding:13px}.progress-copy{min-width:95px}.progress-count{font-size:12px}table{font-size:12px}th,td{padding:8px 6px}.navrow{gap:9px}.nav{padding:11px 13px;font-size:12px}.completion{padding:18px 15px}}\n@media(max-width:400px){.progress-panel{flex-wrap:wrap}.progress-track{order:3;flex-basis:100%}.section-head{gap:9px}.index{flex-basis:34px;height:34px}.data-strip{gap:8px}}\n\u003c/style\u003e\n\n\u003cstyle id=\"kb3-navigation-override\"\u003e\n.navrow{display:none!important}\n\u003c/style\u003e\n\n\n\u003cstyle id=\"mobile-bottom-spacing-fix\"\u003e\n@media (max-width: 700px) {\n  body { padding-bottom: 0 !important; }\n  .page { margin-bottom: 0 !important; }\n}\n\n.math-frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.25;white-space:normal;margin:0 3px;font-size:.95em}\n.math-frac\u003espan:first-child{border-bottom:1.5px solid currentColor;padding:0 5px 2px}\n.math-frac\u003espan:last-child{padding:2px 5px 0}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cmain class=\"page\"\u003e\n  \u003cheader class=\"opening\"\u003e\n  \u003c/section\u003e\n  \u003csection class=\"section\" id=\"activity1\"\u003e\n    \u003cdiv class=\"section-head\"\u003e\u003cdiv class=\"index\"\u003e01\u003c/div\u003e\u003cdiv\u003e\u003ch2\u003eData hubungan K\u003csub\u003ec\u003c/sub\u003e dan K\u003csub\u003ep\u003c/sub\u003e\u003c/h2\u003e\u003cp\u003eIdentifikasi koefisien zat berwujud gas\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003cp\u003eNitrous oxide (N₂O) dapat terurai menjadi nitrogen dan oksigen melalui reaksi berikut.\u003c/p\u003e\n    \u003cdiv class=\"eq\"\u003e2N₂O(g) ⇌ 2N₂(g) + O₂(g)\u003c/div\u003e\n    \u003cdiv class=\"data-strip\"\u003e\n      \u003cdiv class=\"datum\"\u003e\u003cstrong\u003eSuhu\u003c/strong\u003e\u003cspan\u003e25°C = 298 K\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"datum\"\u003e\u003cstrong\u003eKonstanta\u003c/strong\u003e\u003cspan\u003eK\u003csub\u003ec\u003c/sub\u003e = 7,3 × 10\u003csup\u003e34\u003c/sup\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"datum\"\u003e\u003cstrong\u003eKoefisien pereaksi\u003c/strong\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"datum\"\u003e\u003cstrong\u003eKoefisien produk\u003c/strong\u003e\u003cspan\u003e2 + 1\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cp class=\"prompt\"\u003eJumlahkan koefisien gas pada kedua sisi reaksi, lalu tentukan Δn.\u003c/p\u003e\n    \u003ctable\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003eData yang dikumpulkan\u003c/th\u003e\u003cth\u003eIsianmu\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eJumlah koefisien gas produk\u003c/td\u003e\u003ctd\u003e\u003cinput id=\"p\" type=\"number\" step=\"1\" inputmode=\"numeric\" aria-label=\"Jumlah koefisien gas produk\" placeholder=\"Masukkan nilai\"\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eJumlah koefisien gas pereaksi\u003c/td\u003e\u003ctd\u003e\u003cinput id=\"r\" type=\"number\" step=\"1\" inputmode=\"numeric\" aria-label=\"Jumlah koefisien gas pereaksi\" placeholder=\"Masukkan nilai\"\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eΔn = produk − pereaksi\u003c/td\u003e\u003ctd\u003e\u003cinput id=\"d\" type=\"number\" step=\"1\" inputmode=\"numeric\" aria-label=\"Delta n\" placeholder=\"Masukkan nilai\"\u003e\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n    \u003cdetails class=\"hint\"\u003e\u003csummary\u003eBuka petunjuk bertahap\u003c/summary\u003e\u003cdiv class=\"hint-body\"\u003e\u003cb\u003ePetunjuk 1:\u003c/b\u003e Hitung hanya zat yang memiliki tanda (g).\u003cbr\u003e\u003cb\u003ePetunjuk 2:\u003c/b\u003e Jumlah koefisien di kanan adalah 2 + 1, sedangkan di kiri adalah 2.\u003cbr\u003e\u003cb\u003ePetunjuk 3:\u003c/b\u003e Δn = jumlah koefisien gas produk dikurangi jumlah koefisien gas pereaksi.\u003c/div\u003e\u003c/details\u003e\n    \u003cdiv class=\"button-row\"\u003e\u003cbutton type=\"button\" id=\"checkDelta\"\u003ePeriksa Data\u003c/button\u003e\u003cbutton type=\"button\" class=\"secondary\" id=\"resetDelta\"\u003eUlangi Isian\u003c/button\u003e\u003c/div\u003e\n    \u003cdiv id=\"fd\" class=\"feedback\" aria-live=\"polite\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"section-foot\"\u003eSimpan nilai Δn ini untuk digunakan saat menganalisis hubungan K\u003csub\u003ec\u003c/sub\u003e dan K\u003csub\u003ep\u003c/sub\u003e.\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection class=\"section\" id=\"activity2\"\u003e\n    \u003cdiv class=\"section-head\"\u003e\u003cdiv class=\"index\"\u003e02\u003c/div\u003e\u003cdiv\u003e\u003ch2\u003eData untuk kuosien reaksi (Q\u003csub\u003ec\u003c/sub\u003e)\u003c/h2\u003e\u003cp\u003eUbah jumlah zat menjadi konsentrasi molar\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003cp\u003eCampuran gas berada dalam wadah berukuran 3,50 L pada suhu 375°C. Perhatikan jumlah zat awal yang tersedia.\u003c/p\u003e\n    \u003cdiv class=\"eq\"\u003eN₂(g) + 3H₂(g) ⇌ 2NH₃(g)\u003c/div\u003e\n    \u003cdiv class=\"data-strip\"\u003e\n      \u003cdiv class=\"datum\"\u003e\u003cstrong\u003eN₂\u003c/strong\u003e\u003cspan\u003e0,249 mol\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"datum\"\u003e\u003cstrong\u003eH₂\u003c/strong\u003e\u003cspan\u003e3,21 × 10\u003csup\u003e−2\u003c/sup\u003e mol\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"datum\"\u003e\u003cstrong\u003eNH₃\u003c/strong\u003e\u003cspan\u003e6,42 × 10\u003csup\u003e−4\u003c/sup\u003e mol\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"datum\"\u003e\u003cstrong\u003eKonstanta\u003c/strong\u003e\u003cspan\u003eK\u003csub\u003ec\u003c/sub\u003e = 1,2\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"eq\"\u003e[zat] = \u003cspan class=\"math-frac\" aria-label=\"n dibagi V\"\u003e\u003cspan\u003en\u003c/span\u003e\u003cspan\u003eV\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cp class=\"prompt\"\u003eGunakan jumlah mol dan volume untuk menghitung konsentrasi setiap gas.\u003c/p\u003e\n    \u003cdiv class=\"intro-panel\"\u003eMasukkan hasil dalam bentuk \u003cb\u003enilai × 10\u003csup\u003epangkat\u003c/sup\u003e\u003c/b\u003e. Contoh: 0,00917 dapat ditulis sebagai nilai 9,17 dan pangkat −3. Gunakan koma atau titik untuk desimal.\u003c/div\u003e\n    \u003ctable\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003eZat\u003c/th\u003e\u003cth\u003eJumlah (mol)\u003c/th\u003e\u003cth\u003eVolume (L)\u003c/th\u003e\u003cth\u003eKonsentrasi (mol/L)\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eN₂\u003c/td\u003e\u003ctd\u003e0,249\u003c/td\u003e\u003ctd\u003e3,50\u003c/td\u003e\u003ctd\u003e\u003cdiv class=\"sci-entry\"\u003e\u003cinput class=\"sci-coeff\" id=\"n2coef\" type=\"text\" inputmode=\"decimal\" aria-label=\"Nilai konsentrasi N2\" placeholder=\"nilai\"\u003e\u003cspan class=\"times-ten\"\u003e× 10\u003c/span\u003e\u003cinput class=\"sci-exp\" id=\"n2exp\" type=\"number\" step=\"1\" inputmode=\"numeric\" aria-label=\"Pangkat konsentrasi N2\" placeholder=\"pangkat\"\u003e\u003c/div\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eH₂\u003c/td\u003e\u003ctd\u003e3,21 × 10\u003csup\u003e−2\u003c/sup\u003e\u003c/td\u003e\u003ctd\u003e3,50\u003c/td\u003e\u003ctd\u003e\u003cdiv class=\"sci-entry\"\u003e\u003cinput class=\"sci-coeff\" id=\"h2coef\" type=\"text\" inputmode=\"decimal\" aria-label=\"Nilai konsentrasi H2\" placeholder=\"nilai\"\u003e\u003cspan class=\"times-ten\"\u003e× 10\u003c/span\u003e\u003cinput class=\"sci-exp\" id=\"h2exp\" type=\"number\" step=\"1\" inputmode=\"numeric\" aria-label=\"Pangkat konsentrasi H2\" placeholder=\"pangkat\"\u003e\u003c/div\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eNH₃\u003c/td\u003e\u003ctd\u003e6,42 × 10\u003csup\u003e−4\u003c/sup\u003e\u003c/td\u003e\u003ctd\u003e3,50\u003c/td\u003e\u003ctd\u003e\u003cdiv class=\"sci-entry\"\u003e\u003cinput class=\"sci-coeff\" id=\"nh3coef\" type=\"text\" inputmode=\"decimal\" aria-label=\"Nilai konsentrasi NH3\" placeholder=\"nilai\"\u003e\u003cspan class=\"times-ten\"\u003e× 10\u003c/span\u003e\u003cinput class=\"sci-exp\" id=\"nh3exp\" type=\"number\" step=\"1\" inputmode=\"numeric\" aria-label=\"Pangkat konsentrasi NH3\" placeholder=\"pangkat\"\u003e\u003c/div\u003e\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n    \u003cdetails class=\"hint\"\u003e\u003csummary\u003eBuka petunjuk bertahap\u003c/summary\u003e\u003cdiv class=\"hint-body\"\u003e\u003cb\u003ePetunjuk 1:\u003c/b\u003e Konsentrasi molar diperoleh dengan membagi jumlah mol dengan volume larutan atau wadah dalam liter.\u003cbr\u003e\u003cb\u003ePetunjuk 2:\u003c/b\u003e Untuk H₂, ubah 3,21 × 10\u003csup\u003e−2\u003c/sup\u003e mol menjadi 0,0321 mol sebelum membagi dengan 3,50 L.\u003cbr\u003e\u003cb\u003ePetunjuk 3:\u003c/b\u003e Masukkan angka desimal. Contoh format: 0.07114.\u003c/div\u003e\u003c/details\u003e\n    \u003cdiv class=\"button-row\"\u003e\u003cbutton type=\"button\" id=\"checkConc\"\u003ePeriksa Konsentrasi\u003c/button\u003e\u003cbutton type=\"button\" class=\"secondary\" id=\"resetConc\"\u003eUlangi Isian\u003c/button\u003e\u003c/div\u003e\n    \u003cdiv id=\"fc\" class=\"feedback\" aria-live=\"polite\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"section-foot\"\u003eData konsentrasi ini akan digunakan untuk menghitung Q\u003csub\u003ec\u003c/sub\u003e pada tahap analisis.\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection class=\"section\" id=\"activity3\"\u003e\n    \u003cdiv class=\"section-head\"\u003e\u003cdiv class=\"index\"\u003e03\u003c/div\u003e\u003cdiv\u003e\u003ch2\u003eData untuk derajat disosiasi\u003c/h2\u003e\u003cp\u003eBandingkan jumlah zat awal dan zat yang terurai\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003cp\u003ePerhatikan model reaksi sederhana berikut. Setiap percobaan dimulai dengan 1,00 mol AB.\u003c/p\u003e\n    \u003cdiv class=\"eq\"\u003eAB(g) ⇌ A(g) + B(g)\u003c/div\u003e\n    \u003cp class=\"prompt\"\u003eHitung fraksi AB yang terurai pada setiap percobaan.\u003c/p\u003e\n    \u003cdiv class=\"eq\"\u003eα = \u003cspan class=\"math-frac\" aria-label=\"mol AB yang terurai dibagi mol AB mula-mula\"\u003e\u003cspan\u003emol AB yang terurai\u003c/span\u003e\u003cspan\u003emol AB mula-mula\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003ctable\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003ePercobaan\u003c/th\u003e\u003cth\u003eMol AB awal\u003c/th\u003e\u003cth\u003eMol AB terurai\u003c/th\u003e\u003cth\u003eNilai α\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003ePercobaan 1\u003c/td\u003e\u003ctd\u003e1,00\u003c/td\u003e\u003ctd\u003e0,10\u003c/td\u003e\u003ctd\u003e\u003cinput id=\"a1\" type=\"number\" step=\"any\" inputmode=\"decimal\" aria-label=\"Derajat disosiasi percobaan 1\" placeholder=\"α\"\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003ePercobaan 2\u003c/td\u003e\u003ctd\u003e1,00\u003c/td\u003e\u003ctd\u003e0,30\u003c/td\u003e\u003ctd\u003e\u003cinput id=\"a2\" type=\"number\" step=\"any\" inputmode=\"decimal\" aria-label=\"Derajat disosiasi percobaan 2\" placeholder=\"α\"\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003ePercobaan 3\u003c/td\u003e\u003ctd\u003e1,00\u003c/td\u003e\u003ctd\u003e0,60\u003c/td\u003e\u003ctd\u003e\u003cinput id=\"a3\" type=\"number\" step=\"any\" inputmode=\"decimal\" aria-label=\"Derajat disosiasi percobaan 3\" placeholder=\"α\"\u003e\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n    \u003cdetails class=\"hint\"\u003e\u003csummary\u003eBuka petunjuk bertahap\u003c/summary\u003e\u003cdiv class=\"hint-body\"\u003e\u003cb\u003ePetunjuk 1:\u003c/b\u003e α adalah perbandingan mol zat yang terurai dengan mol zat mula-mula.\u003cbr\u003e\u003cb\u003ePetunjuk 2:\u003c/b\u003e Setiap percobaan dimulai dengan 1,00 mol AB, sehingga bagi mol AB terurai dengan 1,00.\u003cbr\u003e\u003cb\u003ePetunjuk 3:\u003c/b\u003e Nilai α dapat ditulis sebagai pecahan desimal antara 0 dan 1.\u003c/div\u003e\u003c/details\u003e\n    \u003cdiv class=\"button-row\"\u003e\u003cbutton type=\"button\" id=\"checkAlpha\"\u003ePeriksa Data\u003c/button\u003e\u003cbutton type=\"button\" class=\"secondary\" id=\"resetAlpha\"\u003eUlangi Isian\u003c/button\u003e\u003c/div\u003e\n    \u003cdiv id=\"fa\" class=\"feedback\" aria-live=\"polite\"\u003e\u003c/div\u003e\n\u003c/main\u003e\n\u003cscript\u003e\nconst completed = new Set();\nfunction setFeedback(id, text, type) {\n  const el = document.getElementById(id);\n  if (!el) return;\n  el.textContent = text;\n  el.className = \"feedback show \" + type;\n  el.style.display = \"block\";\n  el.style.visibility = \"visible\";\n  el.style.opacity = \"1\";\n  el.setAttribute(\"role\", type === \"good\" ? \"status\" : \"alert\");\n  requestAnimationFrame(() =\u003e {\n    try {\n      const height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);\n      window.parent.postMessage({ type: \"kb3-feedback-updated\", height }, \"*\");\n    } catch (_) {}\n  });\n}\nfunction updateProgress() {\n  // Elemen progres tidak tersedia pada versi halaman ini; jangan biarkan\n  // ketiadaannya menghentikan pemeriksaan jawaban dan pesan umpan balik.\n  const n = completed.size;\n  const fill = document.getElementById(\"progressFill\");\n  const bar = document.getElementById(\"progressBar\");\n  const count = document.getElementById(\"progressCount\");\n  const text = document.getElementById(\"progressText\");\n  const title = document.getElementById(\"completionTitle\");\n  const detail = document.getElementById(\"completionText\");\n  const mark = document.getElementById(\"completionMark\");\n  if (fill) fill.style.width = (n/3*100) + \"%\";\n  if (bar) bar.setAttribute(\"aria-valuenow\", n);\n  if (count) count.textContent = n + \" dari 3\";\n  if (text) text.textContent = n === 0 ? \"Belum ada aktivitas selesai\" : n === 3 ? \"Semua aktivitas selesai\" : \"Aktivitas diperiksa: \" + n;\n  if (title) title.textContent = n === 3 ? \"Data berhasil dikumpulkan!\" : \"Lanjutkan penyelidikan\";\n  if (detail) detail.textContent = n === 3\n    ? \"Ketiga aktivitas sudah diperiksa. Lanjutkan ke Menganalisis Data untuk membandingkan hasil dan menemukan pola kesetimbangan.\"\n    : \"Selesaikan ketiga aktivitas untuk menandai seluruh data telah diperiksa. Kamu tetap dapat membuka kembali aktivitas sebelumnya.\";\n  if (mark) mark.textContent = n === 3 ? \"✓\" : \"↗\";\n}\nfunction mark(id, ok) {\n  if (ok) completed.add(id); else completed.delete(id);\n  updateProgress();\n}\nfunction num(id) {\n  const el = document.getElementById(id);\n  if (!el || el.value.trim() === \"\") return NaN;\n  const normalized = el.value.trim().replace(\",\", \".\");\n  const value = Number(normalized);\n  return Number.isFinite(value) ? value : NaN;\n}\nfunction scientificValue(prefix) {\n  const coeffEl = document.getElementById(prefix + \"coef\");\n  const expEl = document.getElementById(prefix + \"exp\");\n  if (!coeffEl || !expEl || coeffEl.value.trim() === \"\" || expEl.value.trim() === \"\") return NaN;\n  const coeff = Number(coeffEl.value.trim().replace(\",\", \".\"));\n  const exponent = Number(expEl.value.trim());\n  if (!Number.isFinite(coeff) || !Number.isInteger(exponent)) return NaN;\n  const value = coeff * Math.pow(10, exponent);\n  return Number.isFinite(value) ? value : NaN;\n}\ndocument.getElementById(\"checkDelta\").addEventListener(\"click\", () =\u003e {\n  const p=num(\"p\"), r=num(\"r\"), d=num(\"d\");\n  if (![p,r,d].every(Number.isFinite)) {\n    mark(1,false); return setFeedback(\"fd\",\"Lengkapi ketiga kolom terlebih dahulu. Jumlahkan koefisien gas produk dan pereaksi, lalu tentukan selisihnya.\",\"note\");\n  }\n  if (p===3 \u0026\u0026 r===2 \u0026\u0026 d===1) {\n    mark(1,true); setFeedback(\"fd\",\"Tepat. Jumlah koefisien gas produk = 3 dan pereaksi = 2, sehingga Δn = 3 − 2 = 1. Simpan nilai ini untuk kegiatan analisis.\",\"good\");\n  } else {\n    mark(1,false);\n    let hint = p!==3 ? \"Periksa jumlah koefisien di sisi produk.\" : r!==2 ? \"Periksa jumlah koefisien di sisi pereaksi.\" : \"Hitung kembali Δn dengan mengurangkan jumlah koefisien pereaksi dari produk.\";\n    setFeedback(\"fd\",hint+\" Buka petunjuk jika diperlukan, lalu coba lagi.\",\"try\");\n  }\n});\ndocument.getElementById(\"checkConc\").addEventListener(\"click\", () =\u003e {\n  const prefixes=[\"n2\",\"h2\",\"nh3\"], names=[\"N₂\",\"H₂\",\"NH₃\"], expected=[.249/3.5,.0321/3.5,.000642/3.5];\n  const missing=[];\n  const invalid=[];\n  const values=prefixes.map((prefix,i)=\u003e{\n    const c=document.getElementById(prefix+\"coef\"), e=document.getElementById(prefix+\"exp\");\n    if(!c || !e) { invalid.push(names[i]); return NaN; }\n    if(c.value.trim()===\"\" || e.value.trim()===\"\") { missing.push(names[i]); return NaN; }\n    const coeff=Number(c.value.trim().replace(\",\",\".\"));\n    const exponent=Number(e.value);\n    if(!Number.isFinite(coeff) || !Number.isInteger(exponent) || e.value.trim()===\"\") { invalid.push(names[i]); return NaN; }\n    const value=coeff*Math.pow(10,exponent);\n    if(!Number.isFinite(value)) { invalid.push(names[i]); return NaN; }\n    return value;\n  });\n  if(missing.length) {\n    mark(2,false);\n    return setFeedback(\"fc\",\"Lengkapi nilai koefisien dan pangkat 10 untuk: \"+missing.join(\", \")+\".\",\"note\");\n  }\n  if(invalid.length || values.some(v=\u003e!Number.isFinite(v))) {\n    mark(2,false);\n    return setFeedback(\"fc\",\"Format isian \"+(invalid.length?invalid.join(\", \"):\"konsentrasi\")+\" belum valid. Masukkan koefisien berupa angka desimal dan pangkat 10 berupa bilangan bulat, misalnya 7,114 × 10⁻².\",\"note\");\n  }\n  const tolerance=(i)=\u003eMath.max(Math.abs(expected[i])*.025,0.000001);\n  const wrong=values.map((v,i)=\u003eMath.abs(v-expected[i])\u003etolerance(i));\n  if(wrong.every(v=\u003e!v)) {\n    mark(2,true);\n    setFeedback(\"fc\",\"Benar! Semua konsentrasi sudah tepat dalam batas pembulatan: [N₂] ≈ 0,07114 M; [H₂] ≈ 0,009171 M; dan [NH₃] ≈ 0,0001834 M.\",\"good\");\n  } else {\n    mark(2,false);\n    const wrongNames=wrong.map((bad,i)=\u003ebad?names[i]:null).filter(Boolean);\n    setFeedback(\"fc\",\"Belum tepat. Periksa kembali konsentrasi \"+wrongNames.join(\", \")+\". Gunakan [zat] = n/V: bagi jumlah mol masing-masing gas dengan 3,50 L. Perhatikan juga koefisien dan pangkat 10.\",\"try\");\n  }\n});\ndocument.getElementById(\"checkAlpha\").addEventListener(\"click\", () =\u003e {\n  const ids=[\"a1\",\"a2\",\"a3\"], expected=[.1,.3,.6], values=[], missing=[], invalid=[];\n  ids.forEach((id,i)=\u003e{\n    const el=document.getElementById(id);\n    if(!el) { invalid.push(i+1); values.push(NaN); return; }\n    if(el.validity \u0026\u0026 el.validity.badInput) { invalid.push(i+1); values.push(NaN); return; }\n    if(el.value.trim()===\"\") { missing.push(i+1); values.push(NaN); return; }\n    const value=Number(el.value.trim().replace(\",\",\".\"));\n    if(!Number.isFinite(value)) { invalid.push(i+1); values.push(NaN); return; }\n    values.push(value);\n  });\n  if(missing.length) {\n    mark(3,false);\n    return setFeedback(\"fa\",\"Lengkapi nilai α pada percobaan \"+missing.join(\", \")+\" terlebih dahulu.\",\"note\");\n  }\n  if(invalid.length || values.some(v=\u003e!Number.isFinite(v))) {\n    mark(3,false);\n    return setFeedback(\"fa\",\"Format jawaban pada percobaan \"+invalid.join(\", \")+\" belum valid. Masukkan angka desimal antara 0 dan 1, misalnya 0,30.\",\"note\");\n  }\n  const wrong=values.map((v,i)=\u003eMath.abs(v-expected[i])\u003e=.011);\n  if(wrong.every(v=\u003e!v)) {\n    mark(3,true);\n    setFeedback(\"fa\",\"Tepat! Semua nilai α benar: 0,10; 0,30; dan 0,60. Nilai tersebut menunjukkan fraksi AB mula-mula yang terurai pada setiap percobaan.\",\"good\");\n  } else {\n    mark(3,false);\n    const wrongTrials=wrong.map((bad,i)=\u003ebad?\"percobaan \"+(i+1):null).filter(Boolean);\n    const outOfRange=values.map((v,i)=\u003e(v\u003c0 || v\u003e1)?i+1:null).filter(v=\u003ev!==null);\n    const extra=outOfRange.length?\" Nilai α harus berada antara 0 dan 1.\":\" Bagi mol AB yang terurai dengan 1,00 mol AB mula-mula.\";\n    setFeedback(\"fa\",\"Belum tepat. Periksa kembali \"+wrongTrials.join(\" dan \")+\".\"+extra,\"try\");\n  }\n});\nfunction reset(ids, feedbackId, activityId) {\n  ids.forEach(id=\u003e{const el=document.getElementById(id);if(el)el.value=\"\";});\n  document.getElementById(feedbackId).className=\"feedback\";\n  completed.delete(activityId); updateProgress();\n}\ndocument.getElementById(\"resetDelta\").addEventListener(\"click\",()=\u003ereset([\"p\",\"r\",\"d\"],\"fd\",1));\ndocument.getElementById(\"resetConc\").addEventListener(\"click\",()=\u003ereset([\"n2coef\",\"n2exp\",\"h2coef\",\"h2exp\",\"nh3coef\",\"nh3exp\"],\"fc\",2));\ndocument.getElementById(\"resetAlpha\").addEventListener(\"click\",()=\u003ereset([\"a1\",\"a2\",\"a3\"],\"fa\",3));\nupdateProgress();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e","\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"id\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\u003ctitle\u003eMembaca Pola Kesetimbangan Kimia\u003c/title\u003e\n\u003cstyle\u003e\n*{box-sizing:border-box} :root{--cream:#f4f2de;--paper:#fffdf7;--yellow:#ffde59;--orange:#ff914d;--ink:#3f3a30;--muted:#6b6456;--line:#e6ddbd;--pale:#faf8ed}\nbody{margin:0;background:var(--cream);color:var(--ink);font-family:\"Poppins\",\"Nunito Sans\",\"Segoe UI\",Arial,sans-serif;line-height:1.75;font-weight:400}\n.page{width:92%;max-width:1050px;margin:30px auto 45px}\n.header{padding:30px 36px;margin-bottom:22px;border-radius:27px;background:var(--paper);border:1px solid rgba(220,204,147,.35);box-shadow:0 8px 26px rgba(91,77,35,.08)}\n.eyebrow{display:flex;align-items:center;gap:9px;color:#b96830;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.eyebrow:before{content:\"\";width:25px;height:3px;border-radius:3px;background:var(--orange)}\nh1{margin:10px 0 8px;font-size:clamp(27px,4vw,37px);line-height:1.2;letter-spacing:-.7px;color:#383329} .header p{max-width:750px;margin:0;color:var(--muted);font-size:15px}\n.material{background:var(--paper);border-radius:27px;padding:38px 42px;box-shadow:0 8px 26px rgba(91,77,35,.08);border:1px solid rgba(220,204,147,.35)}\n.intro-title{display:flex;align-items:center;gap:12px;margin-bottom:13px}.intro-icon{width:44px;height:44px;min-width:44px;border-radius:14px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:18px;font-weig {width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;box-shadow:0 3px 6px #00000014}.particle.reactant{background:var(--orange);color:#fff}.particle.product{background:var(--yellow);color:#5d4900}.equilibrium-arrow{font-size:22px;font-weight:800;color:#8b7a4e}.sim-feedback{margin:13px auto 0;padding:12px 15px;border-radius:12px;background:#fff8df;text-align:center;font-size:13px;color:#686052}.sim-feedback.good{background:#eef6e9;color:#4f7046}.formula-card{margin-top:20px;padding:20px;background:#faf8ed;border:1px solid #e7ddbd;border-radius:19px}.formula-card h3{margin:0 0 8px}.step-display{margin-top:13px;padding:17px;background:#fffdf7;border:1px solid #e8dfc6;border-radius:14px;min-height:95px}.step-count{display:inline-flex;align-items:center;width:max-content;max-width:100%;font-family:\"Poppins\",\"Nunito Sans\",\"Segoe UI\",Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:.15px;color:#a65f2d;text-transform:none;background:#fff1d9;border:1px solid #f1d4aa;border-radius:9px;padding:5px 10px;line-height:1.4}.step-count::first-letter{text-transform:uppercase}.step-text{margin-top:6px;color:#5d574b;font-size:14px}.step-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:13px}.primary,.secondary,.nav{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:13px;padding:11px 17px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-decoration:none;transition:.18s}.primary{background:var(--orange);color:white;box-shadow:0 4px 0 #d96d2d}.primary:hover{transform:translateY(-1px)}.secondary{background:#fffdf7;color:#62583e;border:1px solid #ded4b5}.secondary:hover{background:#fff3bd}.data-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.datum{padding:12px 10px;background:#fffdf7;border:1px solid #e8dfc6;border-radius:13px;text-align:center}.datum strong{display:block;font-size:12px}.datum span{display:block;font-size:13px;color:#655d4f}.key-points{margin-top:26px;padding:22px;border-radius:20px;background:linear-gradient(135deg,#fff9df,#fffdf7);border:1px solid #ebdfb7}.key-points h3{margin:0 0 12px}.key-points ul{padding:0;margin:0;list-style:none}.key-points li{position:relative;padding:8px 0 8px 28px;font-size:14px;color:#605a4d;border-bottom:1px dashed #e3dac0}.key-points li:last-child{border-bottom:0}.key-points li:before{content:\"✓\";position:absolute;left:0;top:10px;width:19px;height:19px;border-radius:6px;background:var(--yellow);color:#604b00;font-size:11px;font-weight:900;display:flex;justify-content:center;align-items:center}.alpha-particles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:380px;margin:0 auto}.alpha-dot{width:24px;height:24px;border-radius:50%;background:var(--orange);border:2px solid #fff;box-shadow:0 2px 5px #00000012}.alpha-dot.split{background:var(--yellow)}.alpha-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stat{padding:13px;background:#fffdf7;border:1px solid #e8dfc6;border-radius:13px;text-align:center}.stat .label{font-size:11px;color:#837968}.stat .value{font-size:21px;font-weight:800;color:#433b2e}.navrow{display:flex;justify-content:space-between;gap:12px;margin:24px 2px 8px}.nav{background:var(--orange);color:#fff;box-shadow:0 4px 0 #d96d2d;border-radius:20px}.nav.secondary-nav{background:#fffdf7;color:#62583e;border:1px solid #ded4b5;box-shadow:none}.footer-note{font-size:12px;color:#847b68;text-align:center;margin:15px 0 0}\n@media(max-width:700px){.page{width:94%;margin:18px auto 30px}.header{padding:25px 22px;border-radius:22px}.material{padding:26px 21px;border-radius:22px}h2{font-size:21px}.data-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.particle-stage{gap:7px;padding:10px}.particle-group{padding:8px 3px}.particle{width:21px;height:21px;font-size:8px}.molecule{transform:scale(.84);margin:2px 0}.molecule .atom{width:21px;height:21px;font-size:8px}.molecule .bond{width:8px}.alpha-unit .atom{width:21px;height:21px}.alpha-unit .bond{width:8px}.alpha-particles{gap:3px}.alpha-stats{grid-template-columns:1fr}.navrow{flex-direction:column}.nav{width:100%}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n\n.analysis-steps{display:grid;gap:10px}.analysis-steps .step-display{margin-top:0}.analysis-steps .equation{margin:10px 0;padding:10px}\n/* Ruang reaksi ringkas: panel pereaksi dan produk dipisahkan seperti referensi */\n.reaction-lab{overflow:hidden;border-radius:16px;background:#14243a;border:1px solid #30485f;margin-top:14px;box-shadow:inset 0 0 24px rgba(0,0,0,.12)}\n.reaction-lab-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;color:#fff;background:#14243a;border-bottom:1px solid #ffffff1c;font-size:11px}\n.reaction-lab-top span{padding:5px 9px;border-radius:20px;background:#263c52;color:#d8e7f2;font-size:10px}\n.reaction-lab-top span:before{content:\"\";display:inline-block;width:6px;height:6px;background:#80d6a1;border-radius:50%;margin-right:6px}\n.reaction-panels{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:stretch;gap:8px;padding:10px 12px 8px;background:#14243a}\n.reaction-side{min-width:0;overflow:hidden;border:1px solid #ffffff17;border-radius:14px;background:rgba(27,48,73,.78)}\n.reaction-side-title{min-height:35px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 8px;color:#e5edf5;font-size:11px;font-weight:800;line-height:1.35}\n.reaction-panels canvas{display:block;width:100%;height:clamp(100px,13vw,135px);background:transparent}\n.reaction-arrow{display:flex;align-items:center;justify-content:center;color:#ffde59;font-size:24px;font-weight:700}\n.reaction-lab-legend{display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap;padding:8px 12px 10px;background:#1b3049;color:#e5edf5;font-size:11px}\n.reaction- margin:5px 3px;animation:moleculeDrift 4.8s ease-in-out infinite alternate;transform-origin:center}\n.alpha-unit .atom{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:8px;font-weight:800;border:1px solid rgba(255,255,255,.82);box-shadow:inset -3px -4px 6px rgba(0,0,0,.16),inset 2px 2px 4px rgba(255,255,255,.65),0 2px 4px rgba(0,0,0,.24)}\n.alpha-unit .a-atom{left:3px;top:12px}.alpha-unit .b-atom{left:21px;top:3px}\n.alpha-unit .bond{left:17px;top:18px;width:13px;transform:rotate(-28deg);transition:all .65s ease}\n.alpha-unit.dissociated{animation:splitApart .85s ease both}\n.alpha-unit.dissociated .bond{width:0;opacity:0}\n.alpha-unit.dissociated .atom.a-atom{animation:moveA .85s ease both}\n.alpha-unit.dissociated .atom.b-atom{animation:moveB .85s ease both}\n@keyframes splitApart{0%{transform:scale(.9)}45%{transform:scale(1.08)}100%{transform:scale(1)}}\n@keyframes moveA{from{transform:translate(0,0)}to{transform:translate(-5px,5px)}}\n@keyframes moveB{from{transform:translate(0,0)}to{transform:translate(5px,-5px)}}\n@keyframes appearParticle{from{opacity:.15;transform:scale(.55) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}\n.sim-controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}\n@media(max-width:700px){.molecule{margin:5px 4px;transform:scale(.94)}.alpha-unit{margin:4px 2px}.intro-title{gap:10px;align-items:center}.intro-icon{width:39px;height:39px;min-width:39px;flex-basis:39px;border-radius:12px}h2{font-size:20px}.equation{padding:14px 10px}.frac{white-space:normal}}\n\n\n/* Ajakan bermain game: card penutup materi */\n.game-invite{position:relative;display:flex;align-items:center;gap:22px;overflow:hidden;margin:28px 0 8px;padding:clamp(22px,4vw,34px);border:2px solid #eadb9e;border-radius:24px;background:radial-gradient(circle at 95% 5%,#ffde594d 0 9%,transparent 30%),linear-gradient(135deg,#fff8d9 0%,#fffdf7 72%);box-shad -invite-foot{font-size:10px}}\n@media(max-width:380px){.game-invite-decor{display:none}}\n\n\u003c/style\u003e\n\n\u003cstyle id=\"kb3-navigation-override\"\u003e\n.navrow{display:none!important}\n\u003c/style\u003e\n\n\n\u003cstyle id=\"mobile-bottom-spacing-fix\"\u003e\n@media (max-width: 700px) {\n  body { padding-bottom: 0 !important; }\n  .page { margin-bottom: 0 !important; }\n}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"page\"\u003e\n\u003cmain class=\"material\"\u003e\n\u003csection id=\"maknaK\"\u003e\n\u003cdiv class=\"intro-title\"\u003e\u003cdiv class=\"intro-icon\"\u003eK\u003c/div\u003e\u003cdiv\u003e\u003ch2\u003eMemahami Makna Harga Tetapan Kesetimbangan\u003c/h2\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003eTetapan kesetimbangan \u003cstrong\u003e(K)\u003c/strong\u003e menggambarkan perbandingan komposisi produk dan pereaksi ketika sistem berada pada keadaan setimbang, pada suhu tertentu. Untuk reaksi umum, nilai K ditentukan dari konsentrasi atau tekanan parsial zat-zat yang terlibat sesuai persamaan reaksinya.\u003c/p\u003e\n\u003cdiv class=\"equation\"\u003eaA(g) + bB(g) ⇌ cC(g) + dD(g)\u003c/div\u003e\n\u003cdiv class=\"equation\"\u003eK\u003csub\u003ec\u003c/sub\u003e = \u003cspan class=\"frac\"\u003e\u003cspan class=\"num\"\u003e[C]\u003csup\u003ec\u003c/sup\u003e[D]\u003csup\u003ed\u003c/sup\u003e\u003c/span\u003e\u003cspan class=\"den\"\u003e[A]\u003csup\u003ea\u003c/sup\u003e[B]\u003csup\u003eb\u003c/sup\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cp\u003ePilih kondisi nilai K berikut. Amati bagaimana komposisi relatif partikel produk dan pereaksi digambarkan.\u003c/p\u003e\n\u003cdiv class=\"simulation\"\u003e\n\u003cdiv class=\"sim-heading\"\u003e\u003ch3\u003eEksplorasi nilai K\u003c/h3\u003e\u003cp\u003eContoh ilustratif: 2N₂O(g) ⇌ 2N₂(g) + O₂(g). Bola menunjukkan atom N dan O yang terikat membentuk molekul. Gerak dan jumlah molekul adalah ilustrasi konseptual, bukan simulasi dinamika molekul kuantitatif.\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"equation\"\u003e2N₂O(g) ⇌ 2N₂(g) + O₂(g)\u003c/div\u003e\n\u003cdiv class=\"choice-row\" role=\"group\" aria-label=\"Pilih kondisi nilai K\"\u003e\u003cbutton class=\"choice active\" data-k=\"gt\" type=\"button\" aria-pressed=\"true\"\u003eK \u0026gt; 1\u003c/button\u003e\u003cbutton class=\"choice\" data-k=\"eq\" type=\"button\" aria-pressed=\"false\"\u003eK = 1\u003c/button\u003e\u003cbutton class=\"choice\" data-k=\"lt\" type=\"button\" aria-pressed=\"false\"\u003eK \u0026lt; 1\u003c/button\u003e\u003c/div\u003e\n\u003cdiv class=\"reaction-lab\" aria-live=\"polite\"\u003e\n\u003cdiv class=\"reaction-lab-top\"\u003e\u003cstrong\u003eRUANG REAKSI · MODEL PARTIKEL\u003c/strong\u003e\u003cspan id=\"kStatus\"\u003eSimulasi berjalan\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"reaction-panels\"\u003e\n  \u003cdiv class=\"reaction-side\"\u003e\u003cdiv class=\"reaction-side-title\"\u003ePereaksi · molekul N₂O\u003c/div\u003e\u003ccanvas id=\"kReactantScene\" aria-label=\"Ruang reaksi molekul N₂O sebagai pereaksi\"\u003eBrowser tidak mendukung canvas.\u003c/canvas\u003e\u003c/div\u003e\n  \u003cdiv class=\"reaction-arrow\" aria-label=\"Kesetimbangan\"\u003e⇌\u003c/div\u003e\n  \u003cdiv class=\"reaction-side\"\u003e\u003cdiv class=\"reaction-side-title\"\u003eProduk · molekul N₂ dan O₂\u003c/div\u003e\u003ccanvas id=\"kProductScene\" aria-label=\"Ruang reaksi molekul N₂ dan O₂ sebagai produk\"\u003eBrowser tidak mendukung canvas.\u003c/canvas\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"reaction-lab-legend\"\u003e\u003cspan\u003e\u003ci class=\"legend-dot\" style=\"background:#8ab7d9\"\u003e\u003c/i\u003eN · nitrogen\u003c/span\u003e\u003cspan\u003e\u003ci class=\"legend-dot\" style=\"background:#e8a9a2\"\u003e\u003c/i\u003eO · oksigen\u003c/span\u003e\u003cspan id=\"kCount\"\u003eN₂O: 4 | N₂: 4 | O₂: 2\u003c/span\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"chem-legend\"\u003e\u003cspan class=\"legend-item\"\u003e\u003ci class=\"legend-dot\" style=\"background:#8ab7d9\"\u003e\u003c/i\u003eN (nitrogen)\u003c/span\u003e\u003cspan class=\"legend-item\"\u003e\u003ci class=\"legend-dot\" style=\"background:#e8a9a2\"\u003e\u003c/i\u003eO (oksigen)\u003c/span\u003e\u003c/div\u003e\n\n\u003cdiv class=\"sim-feedback\" id=\"kFeedback\"\u003eK \u003e 1: produk relatif lebih dominan pada keadaan setimbang.\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"note\"\u003e\u003cdiv class=\"note-icon\"\u003e!\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003ePerlu diingat.\u003c/strong\u003e Nilai K tidak menunjukkan cepat atau lambatnya reaksi. Nilai K juga tidak langsung menentukan arah perubahan sistem yang belum setimbang; untuk itu, bandingkan Q dengan K.\u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003cdiv class=\"divider\"\u003e\u003c/div\u003e\n\u003csection id=\"kc-kp\"\u003e\n\u003cdiv class=\"intro-title\"\u003e\u003cdiv class=\"intro-icon\"\u003eKp\u003c/div\u003e\u003cdiv\u003e\u003ch2\u003eMenghubungkan K\u003csub\u003ec\u003c/sub\u003e dan K\u003csub\u003ep\u003c/sub\u003e\u003c/h2\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eK\u003csub\u003ec\u003c/sub\u003e\u003c/strong\u003e dinyatakan menggunakan konsentrasi molar, sedangkan \u003cstrong\u003eK\u003csub\u003ep\u003c/sub\u003e\u003c/strong\u003e menggunakan tekanan parsial gas. Hubungan keduanya untuk reaksi gas dituliskan sebagai berikut.\u003c/p\u003e\n\u003cdiv class=\"equation\"\u003eK\u003csub\u003ep\u003c/sub\u003e = K\u003csub\u003ec\u003c/sub\u003e(RT)\u003csup\u003eΔn\u003c/sup\u003e\u003c/div\u003e\n\u003cp\u003eΔn adalah jumlah koefisien gas produk dikurangi jumlah koefisien gas pereaksi. Gunakan data yang sudah kamu temukan pada aktivitas sebelumnya.\u003c/p\u003e\n\u003cdiv class=\"formula-card\"\u003e\u003ch3\u003eContoh dari data N₂O\u003c/h3\u003e\u003cdiv class=\"equation\"\u003e2N₂O(g) ⇌ 2N₂(g) + O₂(g)\u003c/div\u003e\n\u003cdiv class=\"data-grid\"\u003e\u003cdiv class=\"datum\"\u003e\u003cstrong\u003eSuhu\u003c/strong\u003e\u003cspan\u003e298 K\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"datum\"\u003e\u003cstrong\u003eK\u003csub\u003ec\u003c/sub\u003e\u003c/strong\u003e\u003cspan\u003e7,3 × 10\u003csup\u003e34\u003c/sup\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"datum\"\u003e\u003cstrong\u003eKoefisien produk\u003c/strong\u003e\u003cspan\u003e2 + 1 = 3\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"datum\"\u003e\u003cstrong\u003eKoefisien pereaksi\u003c/strong\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"analysis-steps\"\u003e\n\u003cdiv class=\"step-display\"\u003e\u003cdiv class=\"step-count\"\u003e1 · Tentukan Δn\u003c/div\u003e\u003cdiv class=\"step-text\"\u003eProduk: 2 + 1 = 3. Pereaksi: 2. Maka \u003cstrong\u003eΔn = 3 − 2 = 1\u003c/strong\u003e.\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"step-display\"\u003e\u003cdiv class=\"step-count\"\u003e2 · Substitusi\u003c/div\u003e\u003cdiv class=\"step-text\"\u003eDengan R = 0,08206 L·atm·mol⁻¹·K⁻¹ dan T = 298 K, RT ≈ 24,45.\u003cbr\u003e\u003cspan class=\"equation\"\u003eK\u003csub\u003ep\u003c/sub\u003e = (7,3 × 10\u003csup\u003e34\u003c/sup\u003e)(24,45)\u003csup\u003e1\u003c/sup\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"step-display\"\u003e\u003cdiv class=\"step-count\"\u003e3 · Hasil dan makna\u003c/div\u003e\u003cdiv class=\"step-text\"\u003e\u003cstrong\u003eK\u003csub\u003ep\u003c/sub\u003e ≈ 1,78 × 10\u003csup\u003e36\u003c/sup\u003e\u003c/strong\u003e. Karena Δn = 1, faktor RT berpangkat satu.\u003c/div\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"note\"\u003e\u003cdiv class=\"note-icon\"\u003ei\u003c/div\u003e\u003cdiv\u003eGunakan \u003cstrong\u003eR = 0,08206 L·atm·mol⁻¹·K⁻¹\u003c/strong\u003e ketika tekanan dinyatakan dalam atm dan volume dalam liter. Dengan data ini, RT ≈ 24,45 dan K\u003csub\u003ep\u003c/sub\u003e ≈ 1,78 × 10\u003csup\u003e36\u003c/sup\u003e (hasil pendekatan numerik). Nilai numerik mengikuti satuan dan konvensi yang digunakan dalam persamaan.\u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003cdiv class=\"divider\"\u003e\u003c/div\u003e\n\u003csection id=\"qc-kc\"\u003e\n\u003cdiv class=\"intro-title\"\u003e\u003cdiv class=\"intro-icon\"\u003eQ\u003c/div\u003e\u003cdiv\u003e\u003ch2\u003eMenginterpretasikan Q\u003csub\u003ec\u003c/sub\u003e dan K\u003csub\u003ec\u003c/sub\u003e\u003c/h2\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003eQ\u003csub\u003ec\u003c/sub\u003e dihitung menggunakan bentuk persamaan yang sama seperti K\u003csub\u003ec\u003c/sub\u003e, tetapi memakai konsentrasi campuran pada kondisi yang sedang diamati. Bandingkan nilai Q\u003csub\u003ec\u003c/sub\u003e dengan K\u003csub\u003ec\u003c/sub\u003e untuk memperkirakan arah perubahan menuju keadaan setimbang.\u003c/p\u003e\n\u003cdiv class=\"equation\"\u003eN₂(g) + 3H₂(g) ⇌ 2NH₃(g)\u003c/div\u003e\n\u003cdiv class=\"data-grid\"\u003e\u003cdiv class=\"datum\"\u003e\u003cstrong\u003eVolume\u003c/strong\u003e\u003cspan\u003e3,50 L\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"datum\"\u003e\u003cstrong\u003en(N₂)\u003c/strong\u003e\u003cspan\u003e0,249 mol\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"datum\"\u003e\u003cstrong\u003en(H₂)\u003c/strong\u003e\u003cspan\u003e3,21 × 10\u003csup\u003e−2\u003c/sup\u003e mol\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"datum\"\u003e\u003cstrong\u003en(NH₃)\u003c/strong\u003e\u003cspan\u003e6,42 × 10\u003csup\u003e−4\u003c/sup\u003e mol\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"formula-card\"\u003e\u003ch3\u003eContoh perhitungan ringkas\u003c/h3\u003e\u003cp\u003eK\u003csub\u003ec\u003c/sub\u003e yang diberikan pada soal adalah 1,2. Ikuti tiga kelompok perhitungan berikut.\u003c/p\u003e\n\u003cdiv class=\"analysis-steps\"\u003e\n\u003cdiv class=\"step-display\"\u003e\u003cdiv class=\"step-count\"\u003e1 · Data dan konsentrasi\u003c/div\u003e\u003cdiv class=\"step-text\"\u003eVolume = 3,50 L.\u003cbr\u003e[N₂] = \u003cspan class=\"frac\"\u003e\u003cspan class=\"num\"\u003e0,249\u003c/span\u003e\u003cspan class=\"den\"\u003e3,50\u003c/span\u003e\u003c/span\u003e ≈ \u003cstrong\u003e0,07114 mol/L\u003c/strong\u003e; [H₂] = \u003cspan class=\"frac\"\u003e\u003cspan class=\"num\"\u003e0,0321\u003c/span\u003e\u003cspan class=\"den\"\u003e3,50\u003c/span\u003e\u003c/span\u003e ≈ \u003cstrong\u003e0,009171 mol/L\u003c/strong\u003e; [NH₃] = \u003cspan class=\"frac\"\u003e\u003cspan class=\"num\"\u003e0,000642\u003c/span\u003e\u003cspan class=\"den\"\u003e3,50\u003c/span\u003e\u003c/span\u003e ≈ \u003cstrong\u003e0,0001834 mol/L\u003c/strong\u003e.\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"step-display\"\u003e\u003cdiv class=\"step-count\"\u003e2 · Susun dan hitung Qc\u003c/div\u003e\u003cdiv class=\"step-text\"\u003e\u003cdiv class=\"equation\"\u003eQ\u003csub\u003ec\u003c/sub\u003e = \u003cspan class=\"frac\"\u003e\u003cspan class=\"num\"\u003e[NH₃]\u003csup\u003e2\u003c/sup\u003e\u003c/span\u003e\u003cspan class=\"den\"\u003e[N₂][H₂]\u003csup\u003e3\u003c/sup\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003eSubstitusi konsentrasi menghasilkan \u003cstrong\u003eQ\u003csub\u003ec\u003c/sub\u003e ≈ 0,613\u003c/strong\u003e (pembulatan).\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"step-display\"\u003e\u003cdiv class=\"step-count\"\u003e3 · Interpretasi\u003c/div\u003e\u003cdiv class=\"step-text\"\u003eQ\u003csub\u003ec\u003c/sub\u003e ≈ 0,613 dan K\u003csub\u003ec\u003c/sub\u003e = 1,2. Karena \u003cstrong\u003eQ\u003csub\u003ec\u003c/sub\u003e \u0026lt; K\u003csub\u003ec\u003c/sub\u003e\u003c/strong\u003e, reaksi cenderung berubah ke arah produk hingga mencapai kesetimbangan.\u003c/div\u003e\u003c/div\u003e\n\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"simulation\"\u003e\u003cdiv class=\"sim-heading\"\u003e\u003ch3\u003eMakna perbandingan Q dengan K\u003c/h3\u003e\u003cp\u003ePilih kondisi untuk melihat interpretasi arah perubahan reaksi.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"choice-row\" role=\"group\" aria-label=\"Pilih perbandingan Q dan K\"\u003e\u003cbutton type=\"button\" class=\"choice active\" data-q=\"lt\" aria-pressed=\"true\"\u003eQ \u0026lt; K\u003c/button\u003e\u003cbutton type=\"button\" class=\"choice\" data-q=\"eq\" aria-pressed=\"false\"\u003eQ = K\u003c/button\u003e\u003cbutton type=\"button\" class=\"choice\" data-q=\"gt\" aria-pressed=\"false\"\u003eQ \u0026gt; K\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"sim-feedback\" id=\"qFeedback\"\u003eQ \u003c K: reaksi cenderung berlangsung ke arah produk.\u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003cdiv class=\"divider\"\u003e\u003c/div\u003e\n\u003csection id=\"alpha\"\u003e\n\u003cdiv class=\"intro-title\"\u003e\u003cdiv class=\"intro-icon\"\u003eα\u003c/div\u003e\u003cdiv\u003e\u003ch2\u003eMemahami Derajat Disosiasi\u003c/h2\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003eDerajat disosiasi (α) menyatakan fraksi jumlah zat mula-mula yang telah terurai. Untuk reaksi \u003cstrong\u003eAB(g) ⇌ A(g) + B(g)\u003c/strong\u003e, jika mula-mula tersedia 1,00 mol AB, maka:\u003c/p\u003e\n\u003cdiv class=\"equation\"\u003eα = \u003cspan class=\"frac\"\u003e\u003cspan class=\"num\"\u003emol AB yang terurai\u003c/span\u003e\u003cspan class=\"den\"\u003emol AB mula-mula\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cp\u003ePilih jumlah AB yang terurai. Amati perubahan visual partikel serta nilai α dalam bentuk desimal dan persentase.\u003c/p\u003e\n\u003cdiv class=\"simulation\"\u003e\u003cdiv class=\"sim-heading\"\u003e\u003ch3\u003eEksplorasi derajat disosiasi\u003c/h3\u003e\u003cp\u003eSetiap pasangan bola terikat menggambarkan AB; saat terdisosiasi, ikatan terputus dan A serta B terpisah. Sepuluh unit gambar mewakili 1,00 mol secara skematis, bukan jumlah partikel sebenarnya.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"choice-row\" role=\"group\" aria-label=\"Pilih mol AB terurai\"\u003e\u003cbutton class=\"choice active\" type=\"button\" data-alpha=\"0.10\" aria-pressed=\"true\"\u003e0,10 mol terurai\u003c/button\u003e\u003cbutton class=\"choice\" type=\"button\" data-alpha=\"0.30\" aria-pressed=\"false\"\u003e0,30 mol terurai\u003c/button\u003e\u003cbutton class=\"choice\" type=\"button\" data-alpha=\"0.60\" aria-pressed=\"false\"\u003e0,60 mol terurai\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"reaction-lab dissociation-lab\"\u003e\u003cdiv class=\"reaction-lab-top\"\u003e\u003cstrong\u003eRUANG REAKSI · DISOSIASI AB\u003c/strong\u003e\u003cspan id=\"alphaStatus\"\u003eSimulasi berjalan\u003c/span\u003e\u003c/div\u003e\u003ccanvas id=\"alphaScene\" aria-label=\"Simulasi molekul AB terikat dan atom A serta B yang telah terpisah\"\u003eBrowser tidak mendukung canvas.\u003c/canvas\u003e\u003cdiv class=\"reaction-lab-legend\"\u003e\u003cspan\u003e\u003ci class=\"legend-dot\" style=\"background:#ff914d\"\u003e\u003c/i\u003eA\u003c/span\u003e\u003cspan\u003e\u003ci class=\"legend-dot\" style=\"background:#ffde59\"\u003e\u003c/i\u003eB\u003c/span\u003e\u003cspan id=\"alphaCount\"\u003eAB: 9 pasang · A/B terpisah: 1 pasang\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"chem-legend\"\u003e\u003cspan class=\"legend-item\"\u003e\u003ci class=\"legend-dot\" style=\"background:linear-gradient(90deg,#ff914d 0 50%,#ffde59 50%)\"\u003e\u003c/i\u003eAB (masih berikatan)\u003c/span\u003e\u003cspan class=\"legend-item\"\u003e\u003ci class=\"legend-dot\" style=\"background:#ff914d\"\u003e\u003c/i\u003eA\u003c/span\u003e\u003cspan class=\"legend-item\"\u003e\u003ci class=\"legend-dot\" style=\"background:#ffde59\"\u003e\u003c/i\u003eB\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"alpha-stats\"\u003e\u003cdiv class=\"stat\"\u003e\u003cdiv class=\"label\"\u003eAB terurai\u003c/div\u003e\u003cdiv class=\"value\" id=\"alphaDissociated\"\u003e0,10 mol\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003e\u003cdiv class=\"label\"\u003eAB tersisa\u003c/div\u003e\u003cdiv class=\"value\" id=\"alphaRemaining\"\u003e0,90 mol\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003e\u003cdiv class=\"label\"\u003eDerajat disosiasi (α)\u003c/div\u003e\u003cdiv class=\"value\" id=\"alphaValue\"\u003e0,10 · 10%\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"sim-feedback\" id=\"alphaFeedback\"\u003eSebanyak 10% dari jumlah AB mula-mula telah terurai.\u003c/div\u003e\u003cdiv class=\"step-controls\"\u003e\u003cbutton class=\"secondary\" id=\"alphaReset\" type=\"button\"\u003eKembalikan ke 0,10 mol\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003cdiv class=\"key-points\"\u003e\u003ch3\u003eHal penting yang perlu diingat\u003c/h3\u003e\u003cul\u003e\u003cli\u003eNilai K menunjukkan perbandingan komposisi pada keadaan setimbang, bukan laju reaksi.\u003c/li\u003e\u003cli\u003eK\u003csub\u003ep\u003c/sub\u003e dan K\u003csub\u003ec\u003c/sub\u003e dihubungkan melalui Δn dan RT untuk sistem gas.\u003c/li\u003e\u003cli\u003eQ dibandingkan dengan K untuk memprediksi arah perubahan menuju kesetimbangan.\u003c/li\u003e\u003cli\u003eDerajat disosiasi adalah fraksi zat mula-mula yang terurai; nilainya dapat ditulis sebagai desimal atau persentase.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n\n\u003csection class=\"game-invite\" aria-labelledby=\"gameInviteTitle\"\u003e\n  \u003cdiv class=\"game-invite-decor\" aria-hidden=\"true\"\u003e\u003cspan\u003e🌿\u003c/span\u003e\u003cspan\u003e🎲\u003c/span\u003e\u003cspan\u003e🐍\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"game-invite-copy\"\u003e\n    \u003cp class=\"game-invite-tag\"\u003eTantangan selanjutnya\u003c/p\u003e\n    \u003ch2 id=\"gameInviteTitle\"\u003e🌿 Saatnya Bertualang!\u003c/h2\u003e\n    \u003cp\u003eSudah siap menguji pemahamanmu tentang kesetimbangan kimia? Ajak teman-temanmu, lempar dadu, dan taklukkan tantangan di hutan fantasi melalui game \u003cstrong\u003eJungle Equilibrium\u003c/strong\u003e!\u003c/p\u003e\n    \u003cbutton class=\"game-invite-button\" type=\"button\" id=\"playSnakeLadderGame\"\u003e🎲 Mainkan Ular Tangga Kimia \u003cspan aria-hidden=\"true\"\u003e→\u003c/span\u003e\u003c/button\u003e\n    \u003cp class=\"game-invite-foot\"\u003e🪜 Kumpulkan poin, jawab tantangan, dan jadilah penjelajah pertama yang mencapai garis akhir!\u003c/p\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\n\u003cp class=\"footer-note\"\u003eGunakan kembali data dari kegiatan sebelumnya saat membaca setiap penjelasan.\u003c/p\u003e\n\u003c/div\u003e\n\u003cscript\u003e\nconst kConfigs={\n gt:{n2o:3,n2:6,o2:3,text:'K \u003e 1: produk relatif lebih dominan pada keadaan setimbang. Molekul N₂ dan O₂ lebih banyak ditampilkan di ruang reaksi.'},\n eq:{n2o:5,n2:4,o2:2,text:'K = 1: komposisi tidak harus memiliki jumlah molekul pereaksi dan produk yang sama. Visual ini hanya menggambarkan satu komposisi konseptual.'},\n lt:{n2o:7,n2:2,o2:1,text:'K \u003c 1: pereaksi relatif lebih dominan pada keadaan setimbang. Jumlah molekul adalah ilustrasi konseptual, bukan hasil pengukuran K.'}\n};\nconst atomColors={N:'#6389b9',O:'#d66e51',A:'#ff914d',B:'#ffde59'};\nconst $=id=\u003edocument.getElementById(id);\nfunction rand(a,b){return a+Math.random()*(b-a)}\nfunction clamp(v,a,b){return Math.max(a,Math.min(b,v))}\nfunction setupCanvas(id){\n const canvas=$(id),ctx=canvas.getContext('2d');let w=500,h=300,dpr=1;\n function resize(){const rect=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);w=Math.max(rect.width,120);h=Math.max(rect.height,100);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}\n window.addEventListener('resize',resize);resize();return {canvas,ctx,get w(){return w},get h(){return h},resize};\n}\nlet kctx=null;\nfunction drawRoomBackground(room){\n const ctx=room.ctx,w=room.w,h=room.h;\n ctx.clearRect(0,0,w,h);\n const bg=ctx.createLinearGradient(0,0,0,h);\n bg.addColorStop(0,'#172a41');bg.addColorStop(1,'#203750');\n ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);\n ctx.strokeStyle='#ffffff09';ctx.lineWidth=1;\n for(let x=18;x\u003cw;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}\n for(let y=18;y\u003ch;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}\n}\nfunction atom(x,y,r,color,label){\n const g=kctx.createRadialGradient(x-r*.36,y-r*.42,Math.max(1,r*.08),x,y,r);\n g.addColorStop(0,'#ffffff');g.addColorStop(.18,color);g.addColorStop(1,'#17243a');\n kctx.fillStyle=g;kctx.beginPath();kctx.arc(x,y,r,0,Math.PI*2);kctx.fill();\n kctx.strokeStyle='#ffffff75';kctx.lineWidth=1;kctx.stroke();\n kctx.fillStyle='#fff';kctx.font=`bold ${Math.max(8,r*.95)}px Arial`;kctx.textAlign='center';kctx.textBaseline='middle';kctx.fillText(label,x,y+.4);\n}\nfunction bond(x1,y1,x2,y2){\n kctx.strokeStyle='#aab9c9';kctx.lineWidth=3;kctx.lineCap='round';kctx.beginPath();kctx.moveTo(x1,y1);kctx.lineTo(x2,y2);kctx.stroke();\n}\nfunction drawSpecies(ctx,p,time){\n kctx=ctx;\n const wobble=Math.sin(time*.0015+p.phase)*1.4,x=p.x,y=p.y+wobble;\n if(p.type==='n2o'){\n   // N₂O digambarkan sebagai kelompok segitiga kompak; semua atom terhubung.\n   const n1={x:x-8,y:y+5},n2={x:x+8,y:y+5},o={x:x,y:y-9};\n   bond(n1.x,n1.y,n2.x,n2.y);bond(n1.x,n1.y,o.x,o.y);bond(n2.x,n2.y,o.x,o.y);\n   atom(n1.x,n1.y,8.5,atomColors.N,'N');atom(n2.x,n2.y,8.5,atomColors.N,'N');atom(o.x,o.y,8.5,atomColors.O,'O');\n }else if(p.type==='n2'||p.type==='o2'){\n   const col=p.type==='n2'?atomColors.N:atomColors.O,label=p.type==='n2'?'N':'O';\n   const a={x:x-7,y:y+4},b={x:x+8,y:y-4};bond(a.x,a.y,b.x,b.y);atom(a.x,a.y,9,col,label);atom(b.x,b.y,9,col,label);\n }else if(p.type==='ab'){\n   const a={x:x-8,y:y+4},b={x:x+8,y:y-4};bond(a.x,a.y,b.x,b.y);atom(a.x,a.y,10,atomColors.A,'A');atom(b.x,b.y,10,atomColors.B,'B');\n }else if(p.type==='a'){\n   atom(x,y,10,atomColors.A,'A');\n }else if(p.type==='b'){\n   atom(x,y,10,atomColors.B,'B');\n }\n}\nfunction createParticle(type,w,h){return {type,x:rand(26,w-26),y:rand(32,h-25),vx:rand(-25,25),vy:rand(-25,25),phase:rand(0,Math.PI*2)};}\nfunction createRoomSpecies(config,room){let list=[];for(const [type,count] of Object.entries(config))for(let i=0;i\u003ccount;i++)list.push(createParticle(type,room.w,room.h));return list;}\nconst kReactantRoom=setupCanvas('kReactantScene'),kProductRoom=setupCanvas('kProductScene');\nlet kReactantParticles=[],kProductParticles=[],kAnimation=true,kLast=0,kKey='gt';\nfunction renderK(key,reset=true){\n kKey=key;const cfg=kConfigs[key];\n if(reset||!kReactantParticles.length||!kProductParticles.length){\n   kReactantParticles=createRoomSpecies({n2o:cfg.n2o},kReactantRoom);\n   kProductParticles=createRoomSpecies({n2:cfg.n2,o2:cfg.o2},kProductRoom);\n }else{\n   const updateSide=(list,counts,room)=\u003e{for(const type of Object.keys(counts)){let n=list.filter(p=\u003ep.type===type).length;while(n\u003ecounts[type]){const i=list.findIndex(p=\u003ep.type===type);if(i\u003e=0){list.splice(i,1);n--}else break}while(n\u003ccounts[type]){list.push(createParticle(type,room.w,room.h));n++}}};\n   updateSide(kReactantParticles,{n2o:cfg.n2o},kReactantRoom);updateSide(kProductParticles,{n2:cfg.n2,o2:cfg.o2},kProductRoom);\n }\n $('kFeedback').textContent=cfg.text;$('kCount').textContent=`N₂O: ${cfg.n2o}  |  N₂: ${cfg.n2}  |  O₂: ${cfg.o2}`;\n document.querySelectorAll('[data-k]').forEach(b=\u003e{const active=b.dataset.k===key;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});\n}\ndocument.querySelectorAll('[data-k]').forEach(b=\u003eb.addEventListener('click',()=\u003erenderK(b.dataset.k,true)));\nfunction moveParticles(list,room,dt){for(const p of list){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x\u003c23||p.x\u003eroom.w-23)p.vx*=-1;if(p.y\u003c27||p.y\u003eroom.h-20)p.vy*=-1;p.x=clamp(p.x,23,room.w-23);p.y=clamp(p.y,27,room.h-20)}}\nfunction animateK(time){const dt=kLast?Math.min((time-kLast)/1000,.04):0;kLast=time;drawRoomBackground(kReactantRoom);drawRoomBackground(kProductRoom);if(kAnimation){moveParticles(kReactantParticles,kReactantRoom,dt);moveParticles(kProductParticles,kProductRoom,dt)}kReactantParticles.forEach(p=\u003edrawSpecies(kReactantRoom.ctx,p,time));kProductParticles.forEach(p=\u003edrawSpecies(kProductRoom.ctx,p,time));requestAnimationFrame(animateK)}\nrenderK('gt');requestAnimationFrame(animateK);\n// Perbandingan Q dengan K.\ndocument.querySelectorAll('[data-q]').forEach(b=\u003eb.addEventListener('click',()=\u003e{const key=b.dataset.q;document.querySelectorAll('[data-q]').forEach(x=\u003e{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active))});const msg={lt:'Q \u003c K: reaksi cenderung berlangsung ke arah produk.',eq:'Q = K: sistem berada pada keadaan setimbang; tidak ada perubahan bersih komposisi.',gt:'Q \u003e K: reaksi cenderung berlangsung ke arah pereaksi.'};$('qFeedback').textContent=msg[key]}));\n// Ruang reaksi disosiasi: 10 unit skematis, tiap AB yang terurai menjadi A dan B terpisah.\nconst alphaRoom=setupCanvas('alphaScene');let actx=alphaRoom.ctx,alphaAnimation=true,alphaParticles=[],alphaValue=.10,alphaLast=0;\nfunction renderAlpha(value){alphaValue=Number(value);const splitCount=Math.round(alphaValue*10),remainCount=10-splitCount;alphaParticles=[];for(let i=0;i\u003cremainCount;i++)alphaParticles.push(createParticle('ab',alphaRoom.w,alphaRoom.h));for(let i=0;i\u003csplitCount;i++){const cx=rand(35,alphaRoom.w-35),cy=rand(35,alphaRoom.h-30);alphaParticles.push({...createParticle('a',alphaRoom.w,alphaRoom.h),x:cx-6,y:cy+3,vx:rand(-30,30),vy:rand(-30,30)});alphaParticles.push({...createParticle('b',alphaRoom.w,alphaRoom.h),x:cx+8,y:cy-4,vx:rand(-30,30),vy:rand(-30,30)});}\n $('alphaDissociated').textContent=alphaValue.toFixed(2).replace('.',',')+' mol';$('alphaRemaining').textContent=(1-alphaValue).toFixed(2).replace('.',',')+' mol';$('alphaValue').textContent=alphaValue.toFixed(2).replace('.',',')+' · '+Math.round(alphaValue*100)+'%';$('alphaCount').textContent=`AB terikat: ${remainCount}  |  pasangan A/B terpisah: ${splitCount}`;$('alphaFeedback').textContent=`Sebanyak ${Math.round(alphaValue*100)}% AB telah terurai; ${(1-alphaValue).toFixed(2).replace('.',',')} mol AB masih tersisa. Setiap AB yang terurai menghasilkan satu A dan satu B. Sepuluh unit awal merupakan representasi skematis dari 1,00 mol.`;\n document.querySelectorAll('[data-alpha]').forEach(b=\u003e{const active=Number(b.dataset.alpha)===alphaValue;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});}\ndocument.querySelectorAll('[data-alpha]').forEach(b=\u003eb.addEventListener('click',()=\u003e{alphaAnimation=true;$('alphaStatus').textContent='Simulasi berjalan';renderAlpha(b.dataset.alpha)}));\n$('alphaReset').addEventListener('click',()=\u003e{alphaAnimation=true;$('alphaStatus').textContent='Simulasi berjalan';renderAlpha(.10)});\nfunction animateAlpha(time){const dt=alphaLast?Math.min((time-alphaLast)/1000,.04):0;alphaLast=time;drawRoomBackground(alphaRoom);if(alphaAnimation){for(const p of alphaParticles){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x\u003c26||p.x\u003ealphaRoom.w-26)p.vx*=-1;if(p.y\u003c31||p.y\u003ealphaRoom.h-23)p.vy*=-1;p.x=clamp(p.x,26,alphaRoom.w-26);p.y=clamp(p.y,31,alphaRoom.h-23)}}alphaParticles.forEach(p=\u003edrawSpecies(alphaRoom.ctx,p,time));const ctx=alphaRoom.ctx;ctx.fillStyle='#dce6ef';ctx.font='11px Poppins,Arial';ctx.textAlign='left';ctx.fillText('AB(g) ⇌ A(g) + B(g)',12,17);requestAnimationFrame(animateAlpha)}\nrenderAlpha(.10);requestAnimationFrame(animateAlpha);\n\u003c/script\u003e\n\n\u003cdiv id=\"gameView\" style=\"display:none;position:fixed;inset:0;z-index:999999;background:#f4f2de;\"\u003e\n  \u003ciframe id=\"embeddedGame\" title=\"Jungle Equilibrium — Ular Tangga Kimia\" allow=\"autoplay; fullscreen\" style=\   let current = 0;

  function showPage(index){
    if(index < 0 || index >= pages.length) return;

            const bodyHeight = doc.body ? doc.body.scrollHeight : 0;
            const rootHeight = doc.documentElement ? doc.documentElement.scrollHeight : 0;
            const contentHeight = Math.max(bodyHeight, rootHeight);
            if (contentHeight > 0) frame.style.height = contentHeight + 'px';

          if (frame.contentDocument.body) frame._kb3ResizeObserver.observe(frame.contentDocument.body);
        }
        frame.contentWindow.addEventListener('resize', resizeFrame);
        setTimeout(resizeFrame, 100);
        setTimeout(resizeFrame, 500);
        frame.contentDocument.addEventListener('click',(event)=>{
          const target = event.target.closest('[data-page-target]');
          if(target){
            event.preventDefault();
            const next = Number(target.getAttribute('data-page-target'));
            if(Number.isFinite(next)) showPage(next);
          }
        });
      }catch(error){ console.error('Navigasi halaman tidak dapat dipasang:',error); }
    });
  });

  window.addEventListener('message',event=>{
    if(!event.data) return;
    if(event.data.type==='jungle-game-open'){
      const page3=pages[2];
      const nav=page3 ? page3.querySelector('.kb3-navigation') : null;
      if(nav) nav.style.display='none';
      const frame=page3 ? page3.querySelector('iframe') : null;
      if(frame){
        // Game memakai tampilan fullscreen di dalam iframe. Batasi tinggi pembungkus
        // ke tinggi viewport agar tinggi konten game tidak memperpanjang halaman materi.
        frame.dataset.gameOpen='true';
        frame.style.height=Math.max(320, window.innerHeight || document.documentElement.clientHeight || 600)+'px';
      }
    } else if(event.data.type==='jungle-game-close'){
      const page3=pages[2];
      const nav=page3 ? page3.querySelector('.kb3-navigation') : null;
      if(nav) nav.style.display='flex';
      const frame=page3 ? page3.querySelector('iframe') : null;
      if(frame){
        delete frame.dataset.gameOpen;
        // Ukur kembali konten materi setelah game ditutup.
        setTimeout(()=>{
          try {
            const d=frame.contentDocument;
            if(d){
              const h=Math.max(d.body ? d.body.scrollHeight : 0, d.documentElement ? d.documentElement.scrollHeight : 0);
              if(h>0) frame.style.height=h+'px';
            }
          } catch(e) { console.warn('Tinggi halaman materi tidak dapat dipulihkan:', e); }
        },120);
      }
    }
  });

  document.querySelectorAll('[data-go]').forEach(button=>{
    button.addEventListener('click',()=>showPage(Number(button.getAttribute('data-go'))));
  });
})();

  window.addEventListener('message', function(event) {
    if (!event.data || event.data.type !== 'kb3-feedback-updated') return;
    document.querySelectorAll('.kb3-frame').forEach(function(frame) {
      if (frame.contentWindow !== event.source) return;
      try {
        const doc = frame.contentDocument;
        const height = Math.max(Number(event.data.height) || 0, doc.documentElement.scrollHeight, doc.body.scrollHeight);
        if (height > 0) frame.style.height = height + 'px';
      } catch (_) {}
    });
  });
</script>
</body>
</html>
